<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listing Shelf</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, Segoe UI, sans-serif;
        margin: 0;
        padding: 12px 14px;
        min-width: 280px;
        color: #e8eaed;
        background: #1a1d23;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 10px;
        color: #f0f3f6;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 13px;
      }
      label {
        cursor: pointer;
        flex: 1;
      }
      input[type="checkbox"] {
        accent-color: #6c9eff;
      }
      .hint {
        font-size: 11px;
        color: #9aa0a6;
        margin-top: -4px;
        margin-bottom: 10px;
        line-height: 1.35;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #2d6cdf;
        color: #fff;
      }
      button:hover {
        background: #3b7ae8;
      }
      button.secondary {
        margin-top: 8px;
        background: #3c4043;
        color: #e8eaed;
      }
      button.secondary:hover {
        background: #4a4d51;
      }
      .count {
        font-size: 12px;
        color: #9aa0a6;
        margin-bottom: 10px;
      }
      .count strong {
        color: #8ab4f8;
      }
    </style>
  </head>
  <body>
    <h1>Marketplace Listing Shelf</h1>
    <p class="count">Saved: <strong id="count">0</strong> listings</p>
    <div class="row">
      <label for="auto">Capture while I browse</label>
      <input type="checkbox" id="auto" checked />
    </div>
    <div class="row">
      <label for="scroll">Gentle scroll to load more</label>
      <input type="checkbox" id="scroll" />
    </div>
    <p class="hint">
      Open Marketplace search or category, scroll so items load. Shelf dedupes by listing ID. Turn off
      capture on sensitive pages.
    </p>
    <button type="button" id="openShelf">Open shelf &amp; search</button>
    <button type="button" class="secondary" id="reload">Refresh count</button>
    <script src="popup.js"></script>
  </body>
</html>
